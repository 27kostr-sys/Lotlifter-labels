<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LotLifter 2×1 Labels</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f5;margin:0;padding:18px;color:#111}
.wrap{max-width:700px;margin:auto}.card{background:white;padding:17px;border-radius:16px;margin:12px 0;box-shadow:0 1px 8px #0001}
h1{font-size:24px;margin:10px 0 5px}p{line-height:1.4;color:#555}
input[type=file]{display:block;width:100%;font-size:16px;margin:12px 0}
button{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:700;margin-top:10px}
button:disabled{opacity:.35}.status{white-space:pre-line;line-height:1.45;margin-top:12px}.ok{color:#087d2c;font-weight:700}.bad{color:#a33}
.label{aspect-ratio:2/1;border:1px solid #bbb;border-radius:6px;display:flex;align-items:center;padding:4%;margin-top:12px}
.label img{height:88%;width:auto;image-rendering:pixelated}.txt{margin-left:6%}.batchTitle{font-size:12px;font-weight:700}.batch{font-size:18px;font-weight:800}.item{font-size:26px;font-weight:900;margin-top:5px}
.small{font-size:13px;color:#666}
</style>
<!-- Classic scripts are used intentionally for better compatibility with iPhone local HTML files. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
</head>
<body><div class="wrap">
<h1>LotLifter → 2×1 Labels</h1>
<p>Choose your LotLifter PDF, then tap <b>Read PDF</b>. The six-digit value is treated as the batch number.</p>
<div class="card">
<input id="file" type="file" accept=".pdf,application/pdf">
<button id="scan" disabled>Read PDF</button>
<div id="status" class="status">Choose a PDF to begin.</div>
</div>
<div class="card" id="out" hidden>
<button id="make">Create 2×1 PDF</button>
<div id="preview"></div>
</div>
</div>
<script>
(function(){
var fileEl=document.getElementById('file'), scan=document.getElementById('scan'),
 status=document.getElementById('status'), out=document.getElementById('out'),
 preview=document.getElementById('preview'), make=document.getElementById('make');
var labels=[], sourceName='labels';

function msg(t,c){status.className='status '+(c||'');status.textContent=t;}
function librariesReady(){
 if(!window.pdfjsLib){msg("PDF reader couldn't load. Make sure you're online, then close and reopen this file.",'bad');return false;}
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 return true;
}
fileEl.addEventListener('change',function(){
 var ok=fileEl.files && fileEl.files.length>0;
 scan.disabled=!ok;
 msg(ok ? "Selected: "+fileEl.files[0].name+"\nTap Read PDF." : "Choose a PDF to begin.", ok?'ok':'');
});
scan.addEventListener('click',async function(){
 if(!fileEl.files || !fileEl.files.length)return;
 if(!librariesReady())return;
 scan.disabled=true; labels=[]; preview.innerHTML=''; out.hidden=true;
 var file=fileEl.files[0]; sourceName=file.name.replace(/\.pdf$/i,'');
 try{
  msg('Reading PDF…');
  var data=new Uint8Array(await file.arrayBuffer());
  var pdf=await pdfjsLib.getDocument({data:data}).promise;
  for(var pn=1;pn<=pdf.numPages;pn++){
   msg('Reading page '+pn+' of '+pdf.numPages+'…');
   var page=await pdf.getPage(pn);
   var base=page.getViewport({scale:1}), scale=4, vp=page.getViewport({scale:scale});
   var canv=document.createElement('canvas');canv.width=Math.round(vp.width);canv.height=Math.round(vp.height);
   var ctx=canv.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canv.width,canv.height);
   await page.render({canvasContext:ctx,viewport:vp}).promise;
   var tc=await page.getTextContent();
   var items=tc.items.filter(function(x){return x.str&&x.transform}).map(function(x){
    return {text:x.str.trim(),x:x.transform[4],y:base.height-x.transform[5]};
   });
   var ids=items.filter(function(x){return /^MM-\d+$/i.test(x.text)}).sort(function(a,b){return a.y-b.y});
   var batches=items.filter(function(x){return /^\d{6}$/.test(x.text)}).sort(function(a,b){return a.y-b.y});
   ids.forEach(function(id){
    var batch='';
    if(batches.length){batch=batches.reduce(function(best,b){return Math.abs(b.y-id.y)<Math.abs(best.y-id.y)?b:best},batches[0]).text}
    var qrCenterY=id.y, xPt=47, yPt=qrCenterY-36, sizePt=74;
    var crop=document.createElement('canvas');crop.width=Math.round(sizePt*scale);crop.height=Math.round(sizePt*scale);
    var cc=crop.getContext('2d',{alpha:false});cc.fillStyle='#fff';cc.fillRect(0,0,crop.width,crop.height);
    cc.drawImage(canv,Math.round(xPt*scale),Math.round(yPt*scale),Math.round(sizePt*scale),Math.round(sizePt*scale),0,0,crop.width,crop.height);
    labels.push({id:id.text,batch:batch,qr:crop.toDataURL('image/png')});
   });
  }
  if(!labels.length)throw new Error('No MM-#### IDs were detected.');
  var first=labels[0];
  preview.innerHTML='<div class="small">Preview of first label</div><div class="label"><img src="'+first.qr+'"><div class="txt"><div class="batchTitle">BATCH</div><div class="batch">'+first.batch+'</div><div class="item">'+first.id+'</div></div></div>';
  out.hidden=false;
  msg('✓ '+labels.length+' labels found.\nBatch: '+([].concat(labels.map(function(x){return x.batch})).filter(Boolean)[0]||'not detected')+'\nFirst: '+labels[0].id+'   Last: '+labels[labels.length-1].id,'ok');
 }catch(e){console.error(e);msg('Could not read the PDF.\n'+(e.message||e),'bad')}
 scan.disabled=false;
});
make.addEventListener('click',function(){
 if(!labels.length)return;
 if(!window.jspdf){msg("PDF export library couldn't load. Make sure you're online and reopen this file.",'bad');return}
 try{
  msg('Building 2×1 PDF…');
  var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({orientation:'landscape',unit:'pt',format:[72,144],compress:true});
  labels.forEach(function(l,i){
   if(i)doc.addPage([72,144],'landscape');
   var qr=59,left=6,top=6.5,textX=72;
   doc.addImage(l.qr,'PNG',left,top,qr,qr,undefined,'FAST');
   doc.setTextColor(0,0,0);doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.text('BATCH',textX,19);
   doc.setFontSize(9.5);doc.text(l.batch||'',textX,30);
   doc.setFontSize(14);doc.text(l.id,textX,49);
  });
  doc.save(sourceName+'_2x1_labels.pdf');
  msg('✓ Finished '+labels.length+' labels.\nYour 2×1 PDF should now be in Downloads.','ok');
 }catch(e){msg('Could not create the PDF.\n'+(e.message||e),'bad')}
});
setTimeout(function(){if(!window.pdfjsLib)msg("The PDF reader hasn't loaded yet. Make sure you're online, then reopen this file.",'bad')},2500);
})();
</script></body></html>
